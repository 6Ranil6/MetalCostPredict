openapi: 3.0.0
info:
  title: API Системы оценки металлопроката + AI ассистент
  description: |
    Интеллектуальная система оценки стоимости металлопродукции на базе CatBoost.
    
    Включает:
    - Калькулятор цен (ручной ввод, загрузка файлов)
    - AI ассистент с анализом фото (распознаёт товары в таблицах)
    - Систему авторизации пользователей
    - История чатов с сохранением контекста
  version: 2.0.0
servers:
  - url: http://localhost:5111
    description: Локальный backend сервер
  - url: /api
    description: Через Nginx прокси (docker-compose)
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: user_id
      description: "Cookie авторизации с именем user_id (HttpOnly). Используется для идентификации пользователя."

paths:
  /health:
    get:
      tags:
        - System
      summary: Проверка работоспособности API
      responses:
        '200':
          description: Сервер работает
          content:
            text/plain:
              schema:
                type: string
                example: Сервер работает

  /api/register:
    post:
      tags:
        - Auth
      summary: Регистрация нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Иван Иванов
                email:
                  type: string
                  example: ivan@mail.ru
                password:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Успешная регистрация
        '400':
          description: Пользователь с таким Email уже существует или не заполнены поля

  /api/login:
    post:
      tags:
        - Auth
      summary: Вход пользователя в систему
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: ivan@mail.ru
                password:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
        '401':
          description: Неверный логин или пароль

  /api/feedback:
    post:
      tags:
        - User
      summary: Отправка сообщения в техподдержку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, subject, message]
              properties:
                user_id:
                  type: integer
                  nullable: true
                name:
                  type: string
                email:
                  type: string
                subject:
                  type: string
                message:
                  type: string
      responses:
        '200':
          description: Сообщение успешно отправлено

  /predict-manual:
    post:
      tags:
        - Predict
      security:
        - cookieAuth: []
      summary: Ручной расчет цены изделия
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  nullable: true
                Наименование:
                  type: string
                Категория_цены:
                  type: string
                Типоразмер:
                  type: string
                Размер_A:
                  type: string
                Толщина:
                  type: string
      responses:
        '200':
          description: Успешный расчет
          content:
            application/json:
              schema:
                type: object
                properties:
                  price:
                    type: number
                    example: 45500.5

  /predict-file:
    post:
      tags:
        - Predict
      security:
        - cookieAuth: []
      summary: Расчет цен на основе загруженного файла (CSV/Parquet)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Файл до 5МБ
                user_id:
                  type: integer
                  description: ID пользователя для сохранения истории
      responses:
        '200':
          description: Успешная обработка. Возвращается файл CSV с предсказанными ценами.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: Ошибки файла или формата
        '413':
          description: Файл превышает 5МБ

  /api/predictions-history/{user_id}:
    get:
      tags:
        - History
      summary: Получение истории предсказаний пользователя
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            description: "ID пользователя или специальное значение 'me' для текущего пользователя из cookie"
            example: "me"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Массив с историей расчетов

  /api/hide-prediction/{prediction_id}/{user_id}:
    post:
      tags:
        - History
      summary: Скрытие отдельного предсказания (soft delete)
      parameters:
        - name: prediction_id
          in: path
          required: true
          schema:
            type: integer
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            description: "ID пользователя или 'me' для текущего пользователя из cookie"
      responses:
        '200':
          description: Запись скрыта
      security:
        - cookieAuth: []

  /api/hide-all-predictions/{user_id}:
    post:
      tags:
        - History
      summary: Скрытие всех предсказаний пользователя
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            description: "ID пользователя или 'me' для текущего пользователя из cookie"
      responses:
        '200':
          description: Все записи скрыты
      security:
        - cookieAuth: []

  /api/ai-chat:
    post:
      tags:
        - AI Assistant
      summary: Отправить сообщение AI ассистенту с опциональным фото
      description: |
        Основной endpoint для общения с AI помощником. 
        - Принимает текстовое сообщение
        - Опционально анализирует загруженное фото (распознаёт таблицы с товарами)
        - Сохраняет историю в БД для контекста
        - Возвращает ответ от AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, user_id]
              properties:
                message:
                  type: string
                  example: "Какова цена профиля 30х30х1.5?"
                  description: Текстовое сообщение пользователя
                user_id:
                  type: integer
                  example: 1
                  description: ID пользователя (для сохранения истории и контекста)
                session_id:
                  type: string
                  nullable: true
                  example: "session_uuid_123"
                  description: ID сессии чата (если null, система создаст новую)
                image:
                  type: string
                  nullable: true
                  format: byte
                  example: "data:image/jpeg;base64,/9j/4AAQSkZJRgABA..."
                  description: |
                    Фото в формате Base64 (data:image/*;base64,...)
                    Используется для анализа таблиц с товарами
                    Max 5MB (обработано на backend, Nginx 10MB)
      responses:
        '200':
          description: Успешный ответ от AI
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: "Профиль 30х30х1.5 стоит примерно 45500 рублей за тонну."
                  session_id:
                    type: string
                    example: "session_uuid_123"
                  image_analysis:
                    type: object
                    nullable: true
                    description: Результат анализа фото (если было загружено)
                    properties:
                      detected_items:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            category:
                              type: string
                            price:
                              type: number
        '400':
          description: Ошибка валидации (пустое сообщение, некорректный base64 и т.д.)
        '413':
          description: Изображение превышает 5MB
        '500':
          description: Ошибка Ollama или базы данных

  /api/ai-history/{user_id}:
    get:
      tags:
        - AI Assistant
      summary: Получить историю чатов пользователя
      description: |
        Возвращает всю историю разговоров с AI, сгруппированную по сессиям.
        Последние 10 сообщений используются для контекста при ответах AI.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
          description: ID пользователя
        - name: session_id
          in: query
          required: false
          schema:
            type: string
            example: "session_uuid_123"
          description: Если указана, вернёт только сообщения этой сессии
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            example: 50
          description: Максимальное количество сообщений для возврата
      responses:
        '200':
          description: История чатов успешно получена
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        session_id:
                          type: string
                          example: "session_uuid_123"
                        created_at:
                          type: string
                          format: date-time
                          example: "2026-06-09T10:30:00"
                        message_count:
                          type: integer
                          example: 5
                        messages:
                          type: array
                          items:
                            type: object
                            properties:
                              role:
                                type: string
                                enum: [user, assistant]
                              content:
                                type: string
                              image_included:
                                type: boolean
                              created_at:
                                type: string
                                format: date-time
        '404':
          description: Пользователь не найден

  /api/logout:
    post:
      tags:
        - Auth
      summary: Удаляет cookie авторизации (logout)
      responses:
        '200':
          description: Успешный выход

tags:
  - name: System
    description: Системные операции (проверка здоровья)
  - name: Auth
    description: Аутентификация и авторизация (регистрация, вход, выход)
  - name: Predict
    description: Предсказание цен (ручной расчет, загрузка файлов)
  - name: User
    description: Пользовательские функции (обратная связь, профиль)
  - name: History
    description: История операций и предсказаний пользователя
  - name: AI Assistant
    description: AI ассистент для чата и анализа фото товаров
