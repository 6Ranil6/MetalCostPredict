<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">На главную</a>

    <header class="card header-card">
        <h1>Личный кабинет</h1>
        <p class="subtitle">Войдите в систему или создайте новый аккаунт</p>
    </header>

    <div class="card auth-card">
        <!-- переключатель форм -->
        <div class="auth-tabs">
            <button id="tab-login" class="auth-tab-btn active" onclick="toggleAuthMode('login')">Вход</button>
            <button id="tab-register" class="auth-tab-btn" onclick="toggleAuthMode('register')">Регистрация</button>
        </div>

        <!-- форма входа -->
        <form id="login-form" onsubmit="handleAuthSubmit(event, 'login')">
            <div class="form-group mb-lg">
                <label>Email / Логин</label>
                <input type="email" required placeholder="example@mail.ru">
            </div>
            <div class="form-group mb-xl">
                <label>Пароль</label>
                <input type="password" required placeholder="Введите пароль">
            </div>
            <button type="submit" class="calculate-btn mt-0">Войти</button>
        </form>

        <!-- форма регистрации (скрыта по умолчанию) -->
        <form id="register-form" class="hidden" onsubmit="handleAuthSubmit(event, 'register')">
            <div class="form-group mb-lg">
                <label>Ваше ФИО</label>
                <input type="text" required placeholder="ФИО">
            </div>
            <div class="form-group mb-lg">
                <label>Email</label>
                <input type="email" required placeholder="example@mail.ru">
            </div>
            <div class="form-group mb-lg">
                <label>Пароль</label>
                <input type="password" required placeholder="Создайте пароль">
            </div>
            <div class="form-group mb-xl">
                <label>Подтвердите пароль</label>
                <input type="password" required placeholder="Повторите пароль">
            </div>
            <button type="submit" class="calculate-btn mt-0 btn-success">Зарегистрироваться</button>
        </form>
    </div>

    <footer>
        <p>© 2026 Калькулятор стоимости изделий</p>
        <div>
            <a href="https://t.me/ranil_h">Telegram</a>
            <a href="https://vk.com/ranil666">VK</a>
            <a href="https://github.com/6Ranil6">GitHub</a>
        </div>
    </footer>
</div>

<script src="script.js"></script>

<script>
    // проверяем авторизацию при загрузке страницы
    document.addEventListener('DOMContentLoaded', () => {
        const user = JSON.parse(localStorage.getItem('user'));
        // если пользователь уже авторизован - перенаправляем на главную
        if (user) {
            window.location.href = 'index.html';
        }
    });
</script>

<!-- CPM AI Помощник: Кнопка и Модальное окно -->
<button class="cpm-ai-button" id="cpmAiButton" title="CPM AI Помощник">🍊</button>

<!-- Модальное окно чата CPM AI -->
<div class="ai-chat-modal" id="aiChatModal">
    <div class="ai-chat-header">
        <h3>CPM AI</h3>
    </div>
    
    <div class="ai-chat-messages" id="aiChatMessages"></div>
    
    <div class="ai-chat-input-area">
        <div class="ai-chat-image-upload">
            <button type="button" class="ai-chat-image-btn" id="aiImageUploadBtn">🖼️</button>
            <!-- Новая обертка для превью и кнопки удаления -->
            <div class="ai-image-preview-wrapper" id="aiImagePreviewWrapper" style="display: none;">
                <img id="aiImagePreview" class="ai-image-preview">
                <button type="button" class="ai-image-clear-btn" id="aiImageClearBtn">✕</button>
            </div>
        </div>
        <div class="ai-chat-input-wrapper">
            <textarea 
                class="ai-chat-input" 
                id="aiChatInput" 
                placeholder="Задайте вопрос или загрузите изображение..."
                rows="1"
            ></textarea>
            <button class="ai-chat-send-btn" id="aiChatSendBtn">Отправить</button>
        </div>
        <input type="file" id="aiImageInput" accept="image/*" style="display: none;">
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
