server {
    listen 80; # порт HTTP
    server_name _; # любое имя хоста
    root /usr/share/nginx/html; # папка где лежат HTML/CSS/JS файлы
    client_max_body_size 10M; # максимальный размер файла 10Мб

    # Правильные типы контента
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        image/jpeg jpeg jpg;
        image/png png;
        image/svg+xml svg svgz;
        text/plain txt; # Файлы .txt это текст/plain
    }

    # Кэширование для статических файлов
    location ~* \.(js|css|json|png|jpg|jpeg|svg)$ {  # это применится к файлам заканчивающимся на .js, .css и т.д.
        expires 1h; # браузер кэширует эти файлы на 1 час
        add_header Cache-Control "public, max-age=3600"; # говорим браузеру: не скачивай повторно 1 час (3600 сек)
        add_header Access-Control-Allow-Origin "*";  # разрешить запрашивать эти файлы отовсюду (CORS)
    }

    # HTML файлы без кэширования
    location ~* \.html$ {
        expires -1; # Никогда не кэшировать 
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Проксирование API запросов к backend
    location /api/ {                              # Если запрос идёт на /api/*
        proxy_pass http://backend:5111;           # Перенаправить его на контейнер backend порт 5111
        proxy_set_header Host $host;              # Передать исходный хост (чтобы backend знал кто его вызвал)
        proxy_set_header X-Real-IP $remote_addr;  # Передать реальный IP клиента
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Передать всю цепочку IP адресов
        proxy_set_header X-Forwarded-Proto $scheme; # Передать был ли это http или https
        
        # Timeouts
        proxy_connect_timeout 60s;  # на подключение к backend
        proxy_send_timeout 60s;     # на отправку данных backend-у
        proxy_read_timeout 60s;     # на получение ответа от backend
        
        # Cookies
        proxy_cookie_path / /; # Передать cookies от backend с путём / (всё)
    }

    # Главная страница
    location / {                           # Это применится ко всем запросам
        try_files $uri $uri/ /index.html; # Попробовать открыть файл -> папку -> /index.html (SPA)
        add_header Cache-Control "no-cache, no-store, must-revalidate"; # Не кэшировать
    }
}
