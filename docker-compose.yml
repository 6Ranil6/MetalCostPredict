version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: metal_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - metal_network

  backend:
    build: ./backend
    container_name: metal_backend
    restart: always
    ports:
      - "5111:5111"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      PORT: 5111
      # Ollama запущен локально на хосте
      # Для Docker Desktop (macOS/Windows): http://host.docker.internal:11434
      # Для Linux: замените на IP адрес вашей машины или используйте localhost
      OLLAMA_URL: http://host.docker.internal:11435
    volumes:
      - ./backend/models:/app/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5111/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - metal_network

  frontend:
    image: nginx:alpine
    container_name: metal_frontend
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - metal_network

volumes:
  postgres_data:

networks:
  metal_network:
    driver: bridge
